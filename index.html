<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة مدرسة القادسية الذكية للتدريب على الاختبارات المركزية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" data-k>
<style data-k>
:root{--bg:#f4f8fc;--surf:#fff;--ink:#14263d;--mute:#5d6f86;--line:#d9e3ee;--blue:#1d5fa8;--sky:#dcecfa;--gold:#f0a020;--sun:#fff3d6;--maroon:#8b2230;--ok:#1f8a4c;--okbg:#e2f5ea;--bad:#c0332b;--badbg:#fbe6e4;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);box-sizing:border-box;padding-top:var(--sat);padding-bottom:var(--sab)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2a;--surf:#16263b;--ink:#eaf1f9;--mute:#9bb0c8;--line:#2a3f58;--blue:#6aaeed;--sky:#1b3552;--gold:#f5b64a;--sun:#33290f;--maroon:#e58a95;--ok:#4cc585;--okbg:#14382a;--bad:#ff8a80;--badbg:#401c1a}}
:root[data-theme="dark"]{--bg:#0e1a2a;--surf:#16263b;--ink:#eaf1f9;--mute:#9bb0c8;--line:#2a3f58;--blue:#6aaeed;--sky:#1b3552;--gold:#f5b64a;--sun:#33290f;--maroon:#e58a95;--ok:#4cc585;--okbg:#14382a;--bad:#ff8a80;--badbg:#401c1a}
*{box-sizing:border-box}html{scroll-padding-top:var(--sat)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:var(--sat);z-index:5}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.bar h1{font-size:clamp(14px,2.6vw,20px);margin:0;line-height:1.35;font-weight:800;flex:1}
.bar h1 small{display:block;font-weight:500;color:var(--mute);font-size:.72em}
.ib{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:6px 12px;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);background:var(--surf);z-index:10}
main{max-width:1040px;margin:auto;padding:20px 16px 60px}
.hero{background:linear-gradient(160deg,var(--sky),var(--sun));border:1px solid var(--line);border-radius:22px;padding:28px 22px;margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:clamp(22px,4.5vw,34px);font-weight:800;line-height:1.35}
.hero p{margin:0;color:var(--mute);max-width:60ch}
h3{font-size:18px;margin:26px 0 10px;font-weight:800}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:right;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:700}
.opt:hover{border-color:var(--blue)}.opt[aria-pressed=true]{border-color:var(--gold);background:var(--sun)}
.opt .e{font-size:28px}.opt small{display:block;color:var(--mute);font-weight:500}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer}
.btn.g{background:var(--gold);color:#2b1c00}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.r{background:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06121f}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tag{font-size:13px;border-radius:99px;padding:1px 10px;background:var(--sky);color:var(--blue);font-weight:700}
.tag.f{background:var(--sun);color:var(--maroon)}
.crumb{color:var(--mute);margin-bottom:10px}.crumb b{color:var(--ink)}
.q{font-size:20px;font-weight:700;margin:0 0 14px;line-height:1.7}
.ans{display:block;width:100%;text-align:right;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-weight:500}
.ans:hover{border-color:var(--blue)}.ans.sel{border-color:var(--blue);background:var(--sky)}
.ans.ok{border-color:var(--ok);background:var(--okbg)}.ans.no{border-color:var(--bad);background:var(--badbg)}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.dots button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
.dots .on{background:var(--blue);color:#fff;border-color:var(--blue)}.dots .dn{background:var(--sky)}
.timer{font-weight:800;color:var(--maroon);font-variant-numeric:tabular-nums}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:116px;height:116px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:32px;font-weight:800}
.rv{border-inline-start:6px solid var(--line)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}
.note{background:var(--okbg);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px}
.warn{background:var(--sun);border-radius:12px;padding:10px 14px;font-size:15px}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{min-height:150px;direction:rtl}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.doc{overflow-x:auto;line-height:1.9}.doc table{border-collapse:collapse}.doc td,.doc th{border:1px solid var(--line);padding:6px;white-space:normal}.doc img{max-width:100%}.oimg{display:block;max-width:100%;max-height:180px;border-radius:10px;margin:2px auto;background:#fff}.qbi{background:var(--bg)}.qi{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:8px 0 14px;background:#fff}details{margin-top:8px}summary{cursor:pointer;font-weight:700}
.mlogo{font-family:Orbitron,'Segoe UI',Arial,sans-serif;font-weight:900;font-size:var(--ls,16px);letter-spacing:.08em;direction:ltr;display:inline-flex;align-items:center;gap:2px;line-height:1;white-space:nowrap;unicode-bidi:isolate}
.mlogo b{font-weight:900;background:linear-gradient(135deg,var(--blue),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.mlogo i{font-style:normal;color:var(--gold)}
.mp{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--gold);color:#2b1c00;font-family:Georgia,serif;font-weight:700;margin-inline-end:6px;letter-spacing:0}
.bar .mlogo{--ls:15px}
@media(max-width:560px){.bar .mlogo{display:none}}
@media print{.mlogo b{background:none;-webkit-text-fill-color:currentColor;color:var(--blue)}}
footer{text-align:center;color:var(--mute);font-size:14px;padding:20px}
@media print{header,.noprint,footer{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const show=()=>{p.innerHTML=r.dataset.img?`<img src='${r.dataset.img}' alt='' style='height:44px;border-radius:8px;vertical-align:middle'> <button type='button' class='ib'>✕</button>`:'';const x=p.querySelector('button');if(x)x.onclick=e=>{e.preventDefault();delete r.dataset.img;show()}};
const put=async fl=>{p.textContent='…';try{r.dataset.img=await imgUrl(fl)}catch(e){alert('تعذّر معالجة الصورة')}show()};
b.onclick=e=>{e.preventDefault();f.click()};f.onchange=()=>{if(f.files[0])put(f.files[0])};
r.querySelector('.qo').addEventListener('paste',e=>{const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.indexOf('image/')==0);if(it){e.preventDefault();e.stopPropagation();put(it.getAsFile())}})})}
async function imgUrl(f){const bm=await createImageBitmap(f),k=Math.min(1,600/bm.width),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));
try{const as=window.claude&&await claude.use('assets');if(as){const r=await as.upload(bl);if(r&&r.url)return r.url}}catch(e){}
return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(bl)})}
function wireImg(d){const z=d.querySelector('.imz'),p=d.querySelector('.imp');
const show=()=>{p.innerHTML=d.dataset.img?`<img class='qi' src='${d.dataset.img}' alt='' style='margin:8px auto'><button class='btn r' type='button'>إزالة الصورة</button>`:'';const b=p.querySelector('button');if(b)b.onclick=()=>{delete d.dataset.img;show()}};
const put=async f=>{p.textContent='جارٍ تجهيز الصورة…';try{d.dataset.img=await imgUrl(f)}catch(e){alert('تعذّر معالجة الصورة')}show()};
d.addEventListener('paste',e=>{const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.indexOf('image/')==0);if(it){e.preventDefault();put(it.getAsFile())}});
z.querySelector('input').onchange=e=>{if(e.target.files[0])put(e.target.files[0])}}
function bq(){return[...document.querySelectorAll('.qbi')].map(d=>{const qs=[...d.querySelectorAll('.qo')],o=qs.map(x=>x.value.trim()),oi=qs.map(x=>x.closest('.orow').dataset.img||''),r=d.querySelector('input[type=radio]:checked');o.forEach((t,i)=>{if(!t&&oi[i])o[i]='(صورة '+(i+1)+')'});while(o.length>2&&!o[o.length-1]){o.pop();oi.pop()}return{q:d.querySelector('.qq').value.trim(),o,oi:oi.some(Boolean)?oi:[],a:r?+r.value:0,e:d.querySelector('.qe').value.trim(),u:d.querySelector('.qu').value.trim(),img:d.dataset.img||''}}).filter(q=>q.q||q.img)}
function badges(p,n){const c=res.filter(r=>r.n==n).length+1,b=[];if(p==100)b.push('🥇 العلامة الكاملة');else if(p>=90)b.push('⭐ متفوق');if(c>=3)b.push('🔥 مثابر ('+c+' محاولات)');if(!b.length)b.push('🌱 بداية موفقة');return b.map(x=>'<span class="tag f">'+x+'</span>').join(' ')}
function skills(){const m={};st.qs.forEach((q,i)=>{if(!q.u)return;m[q.u]=m[q.u]||[0,0];m[q.u][1]++;if(st.ans[i]==q.a)m[q.u][0]++});const k=Object.keys(m);if(!k.length)return'';return`<div style='text-align:right;margin-top:14px'><b>مستواك في المهارات</b>${k.map(u=>{const p=Math.round(m[u][0]/m[u][1]*100);return`<div class='row' style='margin-top:6px'><span style='min-width:110px'>${esc(u)}</span><div class='prog sp' style='margin:0'><i style='width:${p}%;background:${p>=75?'var(--ok)':'var(--bad)'}'></i></div><span>${p}٪</span></div>`}).join('')}${k.some(u=>m[u][0]/m[u][1]<.75)?`<p class='warn'>راجع المهارات ذات الشريط الأحمر ثم أعد المحاولة.</p>`:''}</div>`}
function honor(){const t=res.slice().sort((a,b)=>b.p-a.p).slice(0,5);return t.length?`<h3>🏆 لوحة الشرف</h3><div class='card'>${t.map((r,i)=>`<div class='row'><b>${['🥇','🥈','🥉','٤','٥'][i]}</b><span class='sp'>${esc(r.n)} <small>${esc(r.t)}</small></span><b>${r.p}٪</b></div>`).join('')}</div>`:''}
function cert(n,p){app.innerHTML=`<div class='card' style='text-align:center;border:6px double var(--gold);padding:30px 18px'><img src='${document.querySelector('.bar img').src}' alt='' style='width:80px;height:80px;border-radius:50%'><h2 style='margin:8px 0'>شهادة تقدير</h2><p>تمنح مدرسة القادسية الأهلية الطالب/ـة</p><h1 style='color:var(--maroon);margin:6px 0'>${esc(n)}</h1><p>تقديرًا لتحقيقه نسبة ${p}٪ في «${esc(ex.title)}» — ${G[ex.g]}، ${S[ex.s][0]}</p><p>${new Date().toLocaleDateString('ar-SA')}</p><p style='margin-top:14px'><span class='mlogo'><span class='mp'>π</span><b>MATH</b><i>-</i><b>AHMED</b></span></p></div><div class='row noprint'><button class='btn' onclick='print()'>طباعة الشهادة</button><button class='btn o' id='bk'>الرئيسية</button></div>`;document.getElementById('bk').onclick=home;scrollTo(0,0)}
async function dl(n,t){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:n,data:t});return}}catch(e){if(e&&e.code=='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}

ds.textContent='🟢 متصل بقاعدة البيانات المشتركة'+(CAN?' (وضع المعلم)':'')}catch(e){ds.textContent='⚪ تُحفظ نتائجك على هذا الجهاز'}})();
